<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0b0e">
<title>Iron Man — เครื่องเล่น Playlist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0e;--panel:#15151b;--line:#3a2a22;--red:#c8202b;--red2:#ff3b3b;--gold:#f0b429;--cyan:#4de8ff;--text:#eee7dc;--mute:#9a8f84;
--th:-apple-system,BlinkMacSystemFont,"Thonburi","Noto Sans Thai","Sarabun","Segoe UI",sans-serif;--hud:"Orbitron",var(--th)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--th);min-height:100%}
body{background:radial-gradient(900px 500px at 50% -120px,#2a0c10 0,transparent 70%),var(--bg);padding:env(safe-area-inset-top) 14px calc(24px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto}
header{display:flex;align-items:center;gap:14px;padding:22px 0 14px}
h1{font-family:var(--hud);font-weight:900;font-size:clamp(26px,7vw,36px);margin:0;letter-spacing:.06em;color:var(--gold);text-shadow:0 0 18px rgba(200,32,43,.55)}
.arc{width:56px;height:56px;flex:none;filter:drop-shadow(0 0 10px rgba(77,232,255,.7))}
.arc .spin{transform-origin:50px 50px;animation:spin 14s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.card{background:linear-gradient(180deg,#1a1a21,var(--panel));border:1px solid var(--line);border-top:2px solid var(--red);border-radius:6px;padding:16px;margin-bottom:14px}
.row{display:flex;gap:8px}
input[type=text]{flex:1;min-width:0;background:#0d0d11;color:var(--text);border:1px solid #4a3a30;border-radius:4px;padding:13px;font-size:16px;font-family:var(--th)}
input[type=text]:focus,button:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
button{font-family:var(--th);cursor:pointer;border:1px solid #5a4030;background:#211a1a;color:var(--text);border-radius:4px;font-size:15px;min-height:48px;padding:0 14px}
button:active{transform:scale(.97)}
.go{background:linear-gradient(180deg,var(--red2),var(--red));border-color:var(--gold);color:#fff;font-weight:700;padding:0 22px}
.status{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;color:var(--mute)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);flex:none}
.dot.busy{background:var(--gold);box-shadow:0 0 8px var(--gold)}.dot.err{background:var(--red2);box-shadow:0 0 8px var(--red2)}.dot.idle{background:#666;box-shadow:none}
.lbl{font-family:var(--hud);font-size:12px;color:var(--cyan);letter-spacing:.08em}
.title{font-size:19px;font-weight:600;margin:6px 0 14px;word-break:break-word;min-height:1.4em}
.stats{display:flex;gap:24px;flex-wrap:wrap}
.num{font-family:var(--hud);font-size:26px;font-weight:700;color:var(--gold)}
.bar{height:4px;background:#2a2320;margin-top:14px;border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .4s}
.ctl{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.ctl button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;padding:8px 2px;min-height:60px}
.ctl b{font-size:20px;font-weight:400;line-height:1}
.ctl .main{background:linear-gradient(180deg,var(--red2),var(--red));border-color:var(--gold)}
.modes label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;cursor:pointer;font-size:15px}
.modes input{accent-color:var(--red2);margin-top:4px;width:18px;height:18px}
.modes small{display:block;color:var(--mute);font-size:12.5px;line-height:1.5}
.vid{position:relative;aspect-ratio:16/9;background:#000;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.vid iframe,.vid #yt{position:absolute;inset:0;width:100%;height:100%;border:0}
.shield{position:absolute;inset:0;z-index:2}
.note{font-size:12.5px;color:var(--mute);line-height:1.6;margin:0}
@media(prefers-reduced-motion:reduce){.arc .spin{animation:none}.bar i{transition:none}}
</style>
</head>
<body>
<main>
<header>
<svg class="arc" viewBox="0 0 100 100" aria-hidden="true">
<circle cx="50" cy="50" r="46" fill="#0b1418" stroke="#4de8ff" stroke-width="3"/>
<g class="spin" fill="none" stroke="#4de8ff" stroke-width="5" stroke-linecap="round">
<path d="M50 12 A38 38 0 0 1 83 31"/><path d="M88 50 A38 38 0 0 1 69 83"/><path d="M50 88 A38 38 0 0 1 17 69"/><path d="M12 50 A38 38 0 0 1 31 17"/></g>
<circle cx="50" cy="50" r="27" fill="none" stroke="#f0b429" stroke-width="2"/>
<polygon points="50,30 67,60 33,60" fill="none" stroke="#4de8ff" stroke-width="3" stroke-linejoin="round"/>
<circle cx="50" cy="50" r="9" fill="#dffaff"/></svg>
<h1>Iron Man</h1>
</header>

<section class="card">
<div class="row">
<input type="text" id="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="วางลิงก์ YouTube Playlist" aria-label="ลิงก์ YouTube Playlist">
<button class="go" id="go">เล่น</button>
</div>
<div class="status"><span class="dot idle" id="dot"></span><span id="status">พร้อมใช้งาน</span></div>
</section>

<section class="card">
<div class="lbl">Now Playing</div>
<div class="title" id="title">กำลังรอเริ่มเล่น</div>
<div class="stats">
<div><div class="lbl">รอบปัจจุบัน</div><div class="num" id="cnt">– / –</div></div>
<div><div class="lbl">รอบที่</div><div class="num" id="rnd">–</div></div>
<div><div class="lbl">ทั้งหมด</div><div class="num" id="tot">–</div></div>
</div>
<div class="bar"><i id="bar"></i></div>
</section>

<section class="card">
<div class="ctl">
<button id="bPrev" aria-label="ก่อนหน้า"><b>⏮</b>ก่อนหน้า</button>
<button id="bBack" aria-label="ถอยหลัง 10 วินาที"><b>↶</b>-10 วินาที</button>
<button id="bPlay" class="main" aria-label="เล่นหรือหยุด"><b id="pIcon">▶</b><span id="pTxt">เล่น</span></button>
<button id="bFwd" aria-label="ข้ามไป 10 วินาที"><b>↷</b>+10 วินาที</button>
<button id="bNext" aria-label="ถัดไป"><b>⏭</b>ถัดไป</button>
</div>
</section>

<section class="card modes">
<label><input type="radio" name="mode" value="smart" checked><span>Smart Shuffle<small>ไม่ซ้ำจนกว่าจะครบทั้ง Playlist แล้วเริ่มรอบใหม่ (ควบคุมโดยหน้าเว็บ)</small></span></label>
<label><input type="radio" name="mode" value="bg"><span>BG-Stable<small>ใช้ Shuffle ของ YouTube ลดการพึ่งพา JavaScript อาจไม่การันตีว่าไม่ซ้ำจนกว่าจะครบทุกเพลง</small></span></label>
</section>

<section class="card">
<div class="vid"><div id="yt"></div><div class="shield"></div></div>
</section>

<p class="note">หมายเหตุ: การเล่นเบื้องหลังและตอนล็อกหน้าจอ iPhone ขึ้นอยู่กับ iOS เบราว์เซอร์ และ YouTube แอปนี้พยายามกู้คืนการเล่นให้ แต่ไม่สามารถรับประกันได้ 100% เพลงจะนับตามรายการที่ YouTube ส่งให้ Player เท่านั้น</p>
</main>

<script>
"use strict";
const DEBUG = false;
const KEY_URL = "ironman.playlistUrl", KEY_MODE = "ironman.mode";
const $ = id => document.getElementById(id);
const log = (...a) => { if (DEBUG) console.log("[Iron]", ...a); };

let player = null, playerReady = false, pendingList = null, listId = null;
let mode = "smart", phase = "idle", ids = [], order = [], total = 0, curIdx = -1, lastIdx = -1;
let playedSet = new Set(), round = 1, carry = false, pendingReshuffle = false;
let wantPlaying = false, userPaused = false, isTransitioning = false, transTimer = null, loadStart = 0;
let lastRecover = 0, recoverTries = 0, lastT = -1, stall = 0, errStreak = 0;

function setStatus(t, kind) { $("status").textContent = t; $("dot").className = "dot" + (kind ? " " + kind : ""); }
function store(k, v) { try { localStorage.setItem(k, v); } catch (e) { log("storage", e); } }
function load(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function parseId(s) {
  s = (s || "").trim();
  if (!s) return null;
  try { const l = new URL(s).searchParams.get("list"); if (l && /^[\w-]{10,}$/.test(l)) return l; } catch (e) {}
  const m = s.match(/[?&]list=([\w-]+)/);
  if (m) return m[1];
  return /^[\w-]{13,}$/.test(s) ? s : null;
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function lock(ms) {
  isTransitioning = true; clearTimeout(transTimer);
  transTimer = setTimeout(() => { isTransitioning = false; }, ms || 2500);
}
function unlock() { isTransitioning = false; clearTimeout(transTimer); }
function resetState() {
  playedSet.clear(); round = 1; carry = false; pendingReshuffle = false;
  phase = "loading"; ids = []; order = []; total = 0; curIdx = -1; lastIdx = -1;
  errStreak = 0; recoverTries = 0; stall = 0; unlock();
}

/*
 * หลักการ: ส่งลำดับที่สุ่มแล้วให้ YouTube เล่นต่อกันเอง (native playlist)
 * เพลงจบ → YouTube เลื่อนเพลงเอง ไม่ต้องรอ JavaScript / user gesture
 */
function loadOrder(i, t) {
  if (!playerReady || !order.length) return;
  phase = "ready"; lastIdx = -1; lock(3000);
  try {
    player.loadPlaylist({ playlist: order, index: i || 0, startSeconds: t || 0 });
    player.setLoop(true); player.setShuffle(false);
  } catch (e) { log(e); unlock(); }
}
function newOrderKeepingCurrent() {
  const vid = order[curIdx]; let t = 0;
  try { t = player.getCurrentTime(); } catch (e) {}
  const rest = shuffle(ids.filter(v => v !== vid));
  order = (vid ? [vid] : []).concat(rest);
  return t;
}
function prepareRound() { const t = newOrderKeepingCurrent(); carry = true; loadOrder(0, t); }
function reshuffleNow() { pendingReshuffle = false; const t = newOrderKeepingCurrent(); loadOrder(0, t); }

function tryInit() {
  if (phase !== "loading") return;
  let l = [];
  try { l = player.getPlaylist() || []; } catch (e) {}
  if (!l.length) return;
  ids = l.slice(); total = ids.length;
  if (mode === "bg") {
    phase = "ready";
    try { player.setShuffle(true); player.setLoop(true); } catch (e) {}
  } else {
    order = shuffle(ids.slice());
    loadOrder(0, 0);
  }
  updateUI();
}

function startPlaylist() {
  const id = parseId($("url").value);
  if (!id) { setStatus("โหลดไม่สำเร็จ: ลิงก์ Playlist ไม่ถูกต้อง", "err"); return; }
  store(KEY_URL, $("url").value.trim());
  listId = id; resetState();
  wantPlaying = true; userPaused = false;
  updateUI();
  if (!playerReady) { pendingList = id; setStatus("กำลังโหลด Playlist", "busy"); return; }
  loadList(id);
}
function loadList(id) {
  setStatus("กำลังโหลด Playlist", "busy"); loadStart = Date.now();
  try { player.loadPlaylist({ list: id, listType: "playlist", index: 0 }); }
  catch (e) { setStatus("โหลดไม่สำเร็จ", "err"); log(e); }
}

/* ---------- ปุ่มควบคุม ---------- */
function next() {
  if (!playerReady || phase !== "ready" || isTransitioning) return;
  userPaused = false; wantPlaying = true; lock(1500);
  try { player.nextVideo(); } catch (e) { unlock(); }
}
function prev() {
  if (!playerReady || phase !== "ready" || isTransitioning) return;
  userPaused = false; wantPlaying = true;
  try {
    if (player.getPlaylistIndex() > 0) { lock(1500); player.previousVideo(); }
    else player.seekTo(0, true);
  } catch (e) { unlock(); }
}
function seekBy(d) {
  if (!playerReady) return;
  try {
    let t = player.getCurrentTime() + d; const dur = player.getDuration();
    if (t < 0) t = 0;
    if (dur > 0 && t > dur - 1) t = Math.max(0, dur - 1);
    player.seekTo(t, true);
  } catch (e) { log(e); }
}
function pause() { userPaused = true; try { player.pauseVideo(); } catch (e) {} }
function resume() {
  userPaused = false; wantPlaying = true;
  try { player.playVideo(); } catch (e) {}
  setTimeout(() => {
    if (!wantPlaying || userPaused || phase !== "ready") return;
    let s; try { s = player.getPlayerState(); } catch (e) { return; }
    if (s !== YT.PlayerState.PLAYING && s !== YT.PlayerState.BUFFERING) hardRecover();
  }, 2500);
}
function toggle() {
  if (!playerReady || phase !== "ready") { startPlaylist(); return; }
  const s = player.getPlayerState();
  if (s === YT.PlayerState.PLAYING || s === YT.PlayerState.BUFFERING) pause(); else resume();
}

/* ---------- YouTube events ---------- */
function onState(e) {
  const S = YT.PlayerState, s = e.data;
  log("state", s);
  if (phase === "loading" && s !== S.UNSTARTED) tryInit();
  if (s === S.PLAYING) {
    errStreak = 0; recoverTries = 0; stall = 0; unlock();
    if (phase === "ready") trackIndex();
    setStatus("กำลังเล่น", ""); setPB("playing"); updateMeta(); setPlayBtn(true);
  } else if (s === S.PAUSED) {
    setStatus(userPaused ? "หยุดชั่วคราว" : "หยุดชั่วคราว (ระบบกำลังตรวจสอบ)", "busy");
    setPB("paused"); setPlayBtn(false);
  } else if (s === S.ENDED) {
    setPB("paused");
    setTimeout(endedFallback, 1500);
  }
  updateUI();
}
function trackIndex() {
  let idx = -1; try { idx = player.getPlaylistIndex(); } catch (e) {}
  if (idx < 0 || idx === lastIdx) return;
  if (mode === "bg") { curIdx = idx; lastIdx = idx; return; }
  const wrapped = lastIdx > 0 && idx === 0 && !carry;      // วนกลับต้นลิสต์เอง (ไม่ได้ผ่าน prepareRound)
  if (carry && idx >= 1) { round++; playedSet.clear(); carry = false; }
  if (wrapped) { round++; playedSet.clear(); }
  const vid = order[idx]; if (vid) playedSet.add(vid);
  lastIdx = idx; curIdx = idx;
  if (wrapped) { if (document.hidden) pendingReshuffle = true; else reshuffleNow(); }
  else if (total > 1 && idx === order.length - 1 && !carry && !document.hidden) prepareRound();
}
function endedFallback() {
  if (!playerReady || !wantPlaying || userPaused || phase !== "ready") return;
  let s; try { s = player.getPlayerState(); } catch (e) { return; }
  if (s !== YT.PlayerState.ENDED) return;
  if (mode === "smart") { round++; playedSet.clear(); carry = false; order = shuffle(ids.slice()); loadOrder(0, 0); }
  else { try { player.loadPlaylist({ list: listId, listType: "playlist", index: 0 }); phase = "loading"; loadStart = Date.now(); } catch (e) {} }
}
function onError(e) {
  log("error", e.data);
  errStreak++; unlock();
  if (errStreak > 5) { setStatus("โหลดไม่สำเร็จ: เพลงเล่นไม่ได้ต่อเนื่องหลายเพลง หรือ Playlist เป็นส่วนตัว", "err"); wantPlaying = false; return; }
  if (phase !== "ready") { setStatus("โหลดไม่สำเร็จ: ตรวจสอบว่า Playlist เป็นสาธารณะ", "err"); return; }
  setStatus("ข้ามเพลงที่เล่นไม่ได้", "busy");
  setTimeout(() => {
    try { if (player.getPlayerState() !== YT.PlayerState.PLAYING) player.nextVideo(); } catch (x) {}
  }, 1500);
}

/* ---------- Watchdog / Recovery ---------- */
function watchdog() {
  if (!playerReady || !wantPlaying || userPaused) return;
  if (phase === "loading") {
    tryInit();
    if (phase === "loading" && loadStart && Date.now() - loadStart > 25000) setStatus("โหลดไม่สำเร็จ: Playlist ไม่ตอบสนอง ลองกด เล่น อีกครั้ง", "err");
    return;
  }
  if (phase !== "ready" || isTransitioning) return;
  let s; try { s = player.getPlayerState(); } catch (e) { return; }
  const S = YT.PlayerState;
  if (s === S.PLAYING) {
    let t = 0; try { t = player.getCurrentTime(); } catch (e) {}
    stall = Math.abs(t - lastT) < 0.2 ? stall + 1 : 0; lastT = t;
    if (stall >= 5) recover("เวลาไม่เดิน");
  } else if (s === S.PAUSED || s === S.UNSTARTED || s === S.CUED) {
    recover("หยุดเอง");
  } else if (s === S.ENDED) {
    endedFallback();
  } else { stall = 0; }
}
function recover() {
  const now = Date.now();
  if (now - lastRecover < 8000) return;
  lastRecover = now; recoverTries++;
  setStatus("กำลังกู้คืนการเล่น", "busy");
  if (recoverTries >= 3) { recoverTries = 0; stall = 0; hardRecover(); return; }
  try { player.playVideo(); } catch (e) { log(e); }
}
function hardRecover() {
  log("hard recover");
  try {
    if (mode === "smart" && order.length) loadOrder(Math.max(curIdx, 0), 0);
    else if (listId) { phase = "loading"; loadStart = Date.now(); player.loadPlaylist({ list: listId, listType: "playlist", index: Math.max(curIdx, 0) }); }
  } catch (e) { log(e); }
}
setInterval(watchdog, 3000);
document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  if (pendingReshuffle && mode === "smart" && phase === "ready") reshuffleNow();
  else if (mode === "smart" && phase === "ready" && !carry && total > 1 && curIdx === order.length - 1) prepareRound();
  setTimeout(watchdog, 400);
});

/* ---------- Media Session ---------- */
function setPB(st) { try { if ("mediaSession" in navigator) navigator.mediaSession.playbackState = st; } catch (e) {} }
function vdata() { try { return player.getVideoData() || {}; } catch (e) { return {}; } }
function updateMeta() {
  const d = vdata();
  if (d.title) $("title").textContent = d.title;
  if (!("mediaSession" in navigator) || typeof MediaMetadata === "undefined" || !d.title) return;
  try {
    const art = d.video_id ? [{ src: "https://i.ytimg.com/vi/" + d.video_id + "/hqdefault.jpg", sizes: "480x360", type: "image/jpeg" }] : [];
    navigator.mediaSession.metadata = new MediaMetadata({ title: d.title, artist: d.author || "Iron Man", album: "Iron Man", artwork: art });
  } catch (e) { log(e); }
}
function setupMediaSession() {
  if (!("mediaSession" in navigator)) return;
  const h = { play: resume, pause: pause, previoustrack: prev, nexttrack: next, seekbackward: () => seekBy(-10), seekforward: () => seekBy(10) };
  for (const k in h) { try { navigator.mediaSession.setActionHandler(k, h[k]); } catch (e) { log("unsupported", k); } }
  setPB("none");
}

/* ---------- UI ---------- */
function setPlayBtn(playing) { $("pIcon").textContent = playing ? "⏸" : "▶"; $("pTxt").textContent = playing ? "หยุด" : "เล่น"; }
function updateUI() {
  $("tot").textContent = total ? String(total) : "–";
  if (mode === "smart" && total) {
    $("cnt").textContent = playedSet.size + " / " + total;
    $("rnd").textContent = String(round);
    $("bar").style.width = Math.min(100, playedSet.size / total * 100) + "%";
  } else if (mode === "bg" && total) {
    $("cnt").textContent = curIdx >= 0 ? (curIdx + 1) + " / " + total : "– / " + total;
    $("rnd").textContent = "–";
    $("bar").style.width = curIdx >= 0 ? ((curIdx + 1) / total * 100) + "%" : "0";
  } else { $("cnt").textContent = "– / –"; $("rnd").textContent = "–"; $("bar").style.width = "0"; }
}
setInterval(() => { if (playerReady && phase === "ready") updateMeta(); }, 5000);

window.onYouTubeIframeAPIReady = function () {
  try {
    const pv = { playsinline: 1, controls: 0, disablekb: 1, rel: 0, modestbranding: 1 };
    if (location.protocol.indexOf("http") === 0) pv.origin = location.origin;
    player = new YT.Player("yt", {
      width: "100%", height: "100%", playerVars: pv,
      events: {
        onReady: () => { playerReady = true; if (pendingList) { const id = pendingList; pendingList = null; loadList(id); } },
        onStateChange: onState, onError: onError
      }
    });
  } catch (e) { setStatus("โหลดไม่สำเร็จ: เริ่ม YouTube Player ไม่ได้", "err"); }
};

document.addEventListener("DOMContentLoaded", () => {
  const saved = load(KEY_URL); if (saved) $("url").value = saved;
  const m = load(KEY_MODE); if (m === "bg" || m === "smart") mode = m;
  document.querySelector('input[name=mode][value=' + mode + ']').checked = true;
  $("go").addEventListener("click", startPlaylist);
  $("url").addEventListener("keydown", e => { if (e.key === "Enter") startPlaylist(); });
  $("bPlay").addEventListener("click", toggle);
  $("bNext").addEventListener("click", next);
  $("bPrev").addEventListener("click", prev);
  $("bBack").addEventListener("click", () => seekBy(-10));
  $("bFwd").addEventListener("click", () => seekBy(10));
  document.querySelectorAll("input[name=mode]").forEach(r => r.addEventListener("change", () => {
    mode = r.value; store(KEY_MODE, mode);
    if (listId && playerReady && wantPlaying) { resetState(); userPaused = false; loadList(listId); }
    updateUI();
  }));
  setupMediaSession();
  const s = document.createElement("script");
  s.src = "https://www.youtube.com/iframe_api";
  s.onerror = () => setStatus("โหลดไม่สำเร็จ: เชื่อมต่อ YouTube ไม่ได้", "err");
  document.head.appendChild(s);
});
</script>
