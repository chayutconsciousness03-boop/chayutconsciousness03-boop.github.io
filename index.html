<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HERO PLAYLIST</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Kanit:wght@400;600&display=swap" rel="stylesheet">
<style>
body{--a:#e23636;--b:#f0b429}
body[data-t=cap]{--a:#1e5bd8;--b:#e8e8f0}
body[data-t=hulk]{--a:#3fae2a;--b:#b57cf0}
body[data-t=bp]{--a:#7b3fe4;--b:#c9c9d6}
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;justify-content:center;color:#fff;font-family:Kanit,system-ui,sans-serif;
 padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);
 background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.09) 1.5px,transparent 0) 0 0/14px 14px,
 linear-gradient(160deg,#151526,#0a0a12 55%,color-mix(in srgb,var(--a) 40%,#000))}
.wrap{width:100%;max-width:460px;display:flex;flex-direction:column;gap:16px}
h1{font-family:Bangers,Impact,sans-serif;font-size:clamp(40px,12vw,58px);letter-spacing:2px;font-weight:400;text-align:center;
 transform:skew(-6deg) rotate(-2deg);color:var(--b);-webkit-text-stroke:2px #000;paint-order:stroke fill;
 text-shadow:4px 4px 0 var(--a),7px 7px 0 #000;line-height:1}
.card{background:#14141f;border:4px solid #000;box-shadow:6px 6px 0 var(--a);padding:14px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;padding:12px;font:inherit;font-size:16px;color:#fff;background:#0a0a12;border:3px solid var(--b);outline:none}
input:focus-visible,button:focus-visible{outline:3px solid #fff;outline-offset:2px}
button{font-family:Bangers,Impact,sans-serif;letter-spacing:1px;font-size:22px;color:#fff;background:var(--a);
 border:3px solid #000;box-shadow:3px 3px 0 #000;padding:8px 16px;cursor:pointer;touch-action:manipulation}
button:active{transform:translate(3px,3px);box-shadow:0 0 0 #000}
#go{background:var(--b);color:#000}
.video{aspect-ratio:16/9;background:#000;border:4px solid var(--b);position:relative}
.video iframe,.video #yt{position:absolute;inset:0;width:100%;height:100%}
.info{text-align:center;padding:14px 10px}
#title{font-weight:600;font-size:18px;line-height:1.3;overflow-wrap:anywhere}
#author{color:#b9b9cc;font-size:14px;margin-top:2px}
#count{display:inline-block;margin-top:10px;padding:4px 12px;background:var(--a);border:3px solid #000;transform:skew(-8deg);font-size:14px}
.ctl{display:flex;justify-content:space-between;gap:8px}
.ctl button{flex:1;font-size:26px;padding:10px 0}
#shuf{background:#2a2a3c;opacity:.6}
#shuf.on{background:var(--b);color:#000;opacity:1}
.themes{display:flex;justify-content:center;gap:12px}
.themes button{width:34px;height:34px;padding:0;border-radius:50%;box-shadow:2px 2px 0 #000}
#msg{min-height:20px;text-align:center;font-size:13px;color:#ffd7a0}
</style>
</head>
<body data-t="iron">
<main class="wrap">
 <h1>HERO PLAYLIST</h1>
 <div class="card row">
  <input id="url" type="url" inputmode="url" placeholder="วางลิงก์ Playlist ของ YouTube" aria-label="ลิงก์ Playlist">
  <button id="go">เล่น!</button>
 </div>
 <div class="video"><div id="yt"></div></div>
 <div class="card info">
  <div id="title">ยังไม่ได้เลือกเพลง</div>
  <div id="author">วางลิงก์ Playlist แล้วกด "เล่น!"</div>
  <span id="count">ทั้งหมด 0 เพลง · สุ่มแล้ว 0/0 ในรอบนี้</span>
 </div>
 <div class="ctl">
  <button id="shuf" class="on" title="สุ่ม">🔀</button>
  <button id="prev" title="ก่อนหน้า">⏮</button>
  <button id="pp" title="เล่น/หยุด">⏯</button>
  <button id="next" title="ถัดไป">⏭</button>
 </div>
 <div id="msg"></div>
 <div class="themes">
  <button data-t="iron" style="background:#e23636" aria-label="ธีม Iron Man"></button>
  <button data-t="cap" style="background:#1e5bd8" aria-label="ธีม Captain America"></button>
  <button data-t="hulk" style="background:#3fae2a" aria-label="ธีม Hulk"></button>
  <button data-t="bp" style="background:#7b3fe4" aria-label="ธีม Black Panther"></button>
 </div>
</main>

<script>
const $=id=>document.getElementById(id);
let player,apiReady=false,loading=false,ids=[],order=[],pos=-1,cur=-1,hist=[],shuffle=true,userPaused=false,silent;

/* ---------- YouTube API ---------- */
const tag=document.createElement('script');tag.src='https://www.youtube.com/iframe_api';document.head.appendChild(tag);
window.onYouTubeIframeAPIReady=()=>{apiReady=true};

/* ---------- Silent audio (ช่วยให้ iOS ถือว่าเป็นแอปเล่นเสียง) ---------- */
function silentWav(){
 const sr=8000,n=sr,b=new Uint8Array(44+n),v=new DataView(b.buffer),s=(o,t)=>[...t].forEach((c,i)=>b[o+i]=c.charCodeAt(0));
 s(0,'RIFF');v.setUint32(4,36+n,true);s(8,'WAVEfmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
 v.setUint32(24,sr,true);v.setUint32(28,sr,true);v.setUint16(32,1,true);v.setUint16(34,8,true);s(36,'data');v.setUint32(40,n,true);
 b.fill(128,44);return URL.createObjectURL(new Blob([b],{type:'audio/wav'}));
}

/* ---------- Shuffle logic ---------- */
function newRound(avoid){
 order=[...Array(ids.length).keys()];
 for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
 if(order.length>1&&order[0]===avoid){const j=1+Math.floor(Math.random()*(order.length-1));[order[0],order[j]]=[order[j],order[0]]}
 pos=-1;
}
function next(){
 if(!ids.length)return;
 if(shuffle){pos++;if(pos>=order.length){newRound(cur);pos=0}playIdx(order[pos])}
 else playIdx((cur+1)%ids.length);
}
function prev(){
 if(!ids.length)return;
 if(hist.length>1){hist.pop();playIdx(hist[hist.length-1],false)}else player.seekTo(0,true);
}
function playIdx(i,rec=true){
 cur=i;if(rec)hist.push(i);userPaused=false;
 player.loadVideoById(ids[i]);updateCount();
}
function updateCount(){
 const n=ids.length;
 $('count').textContent=shuffle?`ทั้งหมด ${n} เพลง · สุ่มแล้ว ${Math.max(pos+1,0)}/${n} ในรอบนี้`:`ทั้งหมด ${n} เพลง · เล่นตามลำดับ ${cur+1}/${n}`;
}

/* ---------- Player ---------- */
function parseId(t){const m=t.match(/[?&]list=([\w-]+)/);return m?m[1]:(/^[\w-]{10,}$/.test(t.trim())?t.trim():null)}
function msg(t){$('msg').textContent=t||''}

async function go(){
 const id=parseId($('url').value);
 if(!id){msg('ลิงก์ไม่ถูกต้อง ต้องมี list=... ในลิงก์');return}
 try{localStorage.setItem('hp-url',$('url').value)}catch(e){}
 if(!silent){silent=new Audio(silentWav());silent.loop=true}
 silent.play().catch(()=>{});
 let w=0;while(!apiReady&&w++<50)await new Promise(r=>setTimeout(r,100));
 if(!apiReady){msg('โหลด YouTube API ไม่สำเร็จ ตรวจสอบอินเทอร์เน็ต');return}
 loading=true;ids=[];hist=[];cur=-1;pos=-1;msg('กำลังโหลด Playlist...');
 if(player)player.cuePlaylist({list:id,listType:'playlist'});
 else player=new YT.Player('yt',{playerVars:{listType:'playlist',list:id,playsinline:1,rel:0,modestbranding:1},
  events:{onStateChange,onError:()=>setTimeout(next,800)}});
}

function fetchIds(tries=0){
 const l=player.getPlaylist();
 if(l&&l.length){
  ids=l;loading=false;msg('');
  if(shuffle)newRound(-1);
  next();
  setTimeout(()=>{if(player.getPlayerState()!==1)msg('แตะปุ่ม ⏯ หรือหน้าจอวิดีโอ 1 ครั้งเพื่อเริ่มเล่น')},2500);
 }else if(tries<8)setTimeout(()=>fetchIds(tries+1),600);
 else{loading=false;msg('อ่าน Playlist ไม่ได้ (ต้องเป็น Playlist สาธารณะ/ไม่ใช่ Mix) และไฟล์ต้องเปิดผ่าน https://')}
}

function onStateChange(e){
 const s=e.data;
 if(s===5&&loading)fetchIds();
 else if(s===0)next();
 else if(s===1){msg('');meta();setPS('playing');silent&&silent.paused&&silent.play().catch(()=>{})}
 else if(s===2){setPS('paused');
  if(!userPaused&&!loading&&document.hidden)setTimeout(()=>{if(!userPaused&&player.getPlayerState()===2)player.playVideo()},600)}
}
function setPS(s){if('mediaSession' in navigator)navigator.mediaSession.playbackState=s}
function meta(){
 const d=player.getVideoData();
 $('title').textContent=d.title||'…';$('author').textContent=d.author||'';
 if('mediaSession' in navigator&&d.video_id)navigator.mediaSession.metadata=new MediaMetadata({
  title:d.title||'',artist:d.author||'',album:'HERO PLAYLIST',
  artwork:[{src:`https://i.ytimg.com/vi/${d.video_id}/hqdefault.jpg`,sizes:'480x360',type:'image/jpeg'}]});
}
function toggle(){
 if(!player)return;
 if(player.getPlayerState()===1){userPaused=true;player.pauseVideo()}else{userPaused=false;player.playVideo()}
}

/* ---------- Controls & lock-screen ---------- */
$('go').onclick=go;
$('url').addEventListener('keydown',e=>{if(e.key==='Enter')go()});
$('next').onclick=next;$('prev').onclick=prev;$('pp').onclick=toggle;
$('shuf').onclick=()=>{
 shuffle=!shuffle;$('shuf').classList.toggle('on',shuffle);
 if(shuffle&&ids.length){newRound(-1);if(cur>=0){const k=order.indexOf(cur);[order[0],order[k]]=[order[k],order[0]];pos=0}}
 if(ids.length)updateCount();
};
document.querySelectorAll('.themes button').forEach(b=>b.onclick=()=>document.body.dataset.t=b.dataset.t);
if('mediaSession' in navigator){
 const h=(a,f)=>{try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}};
 h('play',()=>{userPaused=false;player&&player.playVideo()});
 h('pause',()=>{userPaused=true;player&&player.pauseVideo()});
 h('nexttrack',next);h('previoustrack',prev);
}
document.addEventListener('visibilitychange',()=>{
 if(!document.hidden&&player&&ids.length&&!userPaused&&player.getPlayerState()===2)player.playVideo();
});
try{$('url').value=localStorage.getItem('hp-url')||''}catch(e){}
</script>
</body>
</html>
